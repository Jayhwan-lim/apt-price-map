<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>페이지를 찾을 수 없습니다 | 그땐 얼마?</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <style>
    :root { --fg: #14202b; --muted: #5b6b7a; --line: #ccd6df; --accent: #2a78d6; --bg: #f7f9fb; }
    @media (prefers-color-scheme: dark) { :root { --fg: #e6edf3; --muted: #9aa8b5; --line: #33414e; --accent: #6aa8f0; --bg: #11181f; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
      font: 16px/1.6 "IBM Plex Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    main { padding: 32px 16px; max-width: 420px; text-align: center; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { color: var(--muted); margin: 0 0 24px; word-break: keep-all; }
    a { display: inline-block; margin: 4px; padding: 8px 16px; border: 1px solid var(--line); border-radius: 18px;
      color: var(--accent); text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>페이지를 찾을 수 없습니다</h1>
    <p>주소가 바뀌었거나 없는 페이지입니다.</p>
    <a href="/">지도에서 보기</a>
    <a href="/blog/">단지분석</a>
  </main>
</body>
</html>
