name: Parkrio unit inventory pilot

on:
  push:
    branches: [test/parkrio-hub-pilot-20261011]
  workflow_dispatch:

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATA_GO_KR_HUB_KEY: ${{ secrets.DATA_GO_KR_HUB_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Discover parcel and build checked manifest
        run: |
          python - <<'PY'
          import json, os, requests, sys
          from pathlib import Path
          sys.path.insert(0, 'collector')
          from unit_inventory import pages
          entry = {'sigunguCd': '11710', 'bjdongCd': '10200',
                   'bun': '0017', 'ji': '0000', 'platGbCd': '0'}
          rows = list(pages(requests.Session(), os.environ['DATA_GO_KR_HUB_KEY'],
                            entry, 'getBrTitleInfo'))
          housing = [r for r in rows if int(r.get('hhldCnt') or 0) > 0]
          total = sum(int(r['hhldCnt']) for r in housing)
          names = sorted({r.get('bldNm', '').strip() for r in housing})
          print('residential building titles:', len(housing), 'units:', total,
                'building names:', names)
          if len(housing) != 66 or total != 6864 or not names or '' in names:
              raise SystemExit('parcel/title mismatch; no inventory generated')
          entry.update(complex_key='11710|신천동|17', building_names=names,
                       expected_units=6864)
          Path('data/unit_manifest.json').write_text(json.dumps([entry], ensure_ascii=False))
          PY
      - name: Join unit and exclusive area records
        run: python collector/unit_inventory.py --manifest data/unit_manifest.json --output data/units/inventory.json
      - name: Audit selected area bands
        run: |
          python collector/audit_unit_models.py --inventory data/units/inventory.json --complex-key '11710|신천동|17' --band 35 --output data/units/audit-35.json
          python collector/audit_unit_models.py --inventory data/units/inventory.json --complex-key '11710|신천동|17' --band 85 --output data/units/audit-85.json
