name: api-probe

# Manual check of data.go.kr service access and response schemas.
on:
  workflow_dispatch:
    inputs:
      lots:
        description: "Comma list of sgg-bjd-bun-ji"
        default: "11710-10100-0022-0000"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python collector/api_probe.py
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          DATA_GO_KR_HUB_KEY: ${{ secrets.DATA_GO_KR_HUB_KEY }}
          LOTS: ${{ inputs.lots }}
