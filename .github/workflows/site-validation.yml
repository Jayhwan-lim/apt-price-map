name: site-validation
on:
  push:
    branches: [main]
    paths: ['collector/**', 'web/**', '.github/workflows/site-validation.yml']
  pull_request:
    paths: ['collector/**', 'web/**', '.github/workflows/site-validation.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s collector -p 'test_*.py'
      - run: node --check web/app.js
      - run: node --check web/map-metrics.js
      # The collectors commit new facts a few minutes before their publish
      # step rebuilds map-metrics.json, so a push in that window sees a
      # stale file. That is expected: warn instead of failing the run.
      - name: Map metrics rebuild check
        run: |
          python collector/map_metrics.py
          git diff --quiet -- web/data/map-metrics.json || echo "::warning::map-metrics.json differs from a rebuild (collected facts not yet published)"
      - name: Browser verification
        run: |
          npm install --prefix "$RUNNER_TEMP/site-browser" playwright
          python -m http.server 8765 --directory web > /tmp/site-http.log 2>&1 &
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/site-browser/node_modules/playwright" node collector/check_map_metrics.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-ui-screenshots
          path: /tmp/site-ui/*.png