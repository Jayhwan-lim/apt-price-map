name: building-facts

# Building register (Building HUB) and K-apt facts for every complex, recent
# rent contracts, then the map metrics file. Resumable: each run fetches
# only missing or stale entries, most-traded complexes first.
#
# Two collectors run in parallel on separate runners (the two services
# throttle independently), then `publish` rebuilds map-metrics.json once.
on:
  workflow_dispatch:
    inputs:
      max_calls:
        description: "Request cap per collector"
        default: "100000"
      max_minutes:
        description: "Fetch time budget per collector (minutes)"
        default: "150"
      supply_pages:
        description: "Max 전유공용면적 pages sampled per lot"
        default: "30"
  schedule:
    # 05:11 KST, after collect-trades (04:13) refreshed the complex list,
    # and 17:11 KST so results reach the site twice a day.
    - cron: "11 20 * * *"
    - cron: "11 8 * * *"

permissions:
  contents: write

# Shares the group with collect-trades so the two never push at once.
concurrency:
  group: collect-trades
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  register:
    name: Building HUB (title, supply area)
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Collect
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          DATA_GO_KR_HUB_KEY: ${{ secrets.DATA_GO_KR_HUB_KEY }}
          PHASES: hub,supply
          FACTS_STATUS: status.json
          MAX_CALLS: ${{ inputs.max_calls || '100000' }}
          MAX_MINUTES: ${{ inputs.max_minutes || '150' }}
          SUPPLY_PAGES: ${{ inputs.supply_pages || '30' }}
          # One connection: sequential requests run ~5-6/s without 429s,
          # parallel connections are throttled hard (2026-10-26).
          WORKERS: "1"
        run: python collector/building_facts.py
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/facts/hub data/facts/supply data/facts/lots.json data/facts/status.json
          git diff --cached --quiet && exit 0
          git commit -q -m "data: building register facts $(TZ=Asia/Seoul date +%F)"
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin main && git push -q && exit 0
            sleep $((i * 15))
          done
          exit 1

  kapt:
    name: K-apt (households, use approval, exclusive total)
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Collect
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          PHASES: kapt
          FACTS_STATUS: status-kapt.json
          MAX_CALLS: ${{ inputs.max_calls || '100000' }}
          MAX_MINUTES: ${{ inputs.max_minutes || '150' }}
          WORKERS: "1"
        run: python collector/building_facts.py
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/facts/kapt data/facts/status-kapt.json
          git diff --cached --quiet && exit 0
          git commit -q -m "data: K-apt facts $(TZ=Asia/Seoul date +%F)"
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin main && git push -q && exit 0
            sleep $((i * 15))
          done
          exit 1

  publish:
    name: Rent contracts and map metrics
    needs: [register, kapt]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      CLOUDFLARE_DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: git pull -q origin main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Recent rent contracts
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python collector/fetch_rent.py

      - name: Map metrics
        run: python collector/map_metrics.py | tee /tmp/map-metrics.log

      - name: Commit
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/map-metrics.json
          if [ -d data/raw_rent ]; then git add data/raw_rent; fi
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -q -m "data: map metrics $(TZ=Asia/Seoul date +%F)"
          for i in 1 2 3 4 5; do
            if git pull -q --rebase origin main && git push -q; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            sleep $((i * 15))
          done
          exit 1

      - name: Trigger Cloudflare Pages deploy
        if: steps.commit.outputs.pushed == 'true' && env.CLOUDFLARE_DEPLOY_HOOK_URL != ''
        run: curl -fsS -X POST -o /dev/null "$CLOUDFLARE_DEPLOY_HOOK_URL" && echo "deploy hook called"

      - name: Notify Slack
        if: always() && env.SLACK_WEBHOOK_URL != ''
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          def load(name):
              try:
                  return json.load(open(f"data/facts/{name}", encoding="utf-8"))
              except Exception:
                  return {}
          phases = {**load("status.json").get("phases", {}), **load("status-kapt.json").get("phases", {})}
          def line(name):
              p = phases.get(name) or {}
              return f"{name}: {p.get('done', 0)}/{p.get('queued', 0)}" + (f" (stopped: {p['stopped']})" if p.get("stopped") else "")
          try:
              metrics = open("/tmp/map-metrics.log", encoding="utf-8").read().strip().splitlines()[-1]
          except Exception:
              metrics = "-"
          lines = ["[Claude] 그땐 얼마? 건축물대장·단지정보 수집",
                   *[line(n) for n in ("hub", "supply", "kapt_list", "kapt_basic")],
                   metrics, os.environ["RUN_URL"]]
          req = urllib.request.Request(os.environ["SLACK_WEBHOOK_URL"],
                                       data=json.dumps({"text": "\n".join(lines)}).encode(),
                                       headers={"Content-Type": "application/json"})
          urllib.request.urlopen(req, timeout=10)
          PY
