name: Ricenz counted inventory audit
on:
  push:
    branches: [research/ricenz-inventory-pilot-20261011]
    paths: ['.github/workflows/ricenz-unit-pilot.yml', 'collector/unit_inventory.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATA_GO_KR_HUB_KEY: ${{ secrets.DATA_GO_KR_HUB_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Fetch and audit counted inventory without publishing
        run: |
          python - <<'PY'
          import concurrent.futures, json, os, requests, sys, threading, time
          from collections import Counter
          from pathlib import Path
          sys.path.insert(0, 'collector')
          from unit_inventory import count_units, unit_key
          key = os.environ['DATA_GO_KR_HUB_KEY']
          entry = dict(sigunguCd='11710', bjdongCd='10100', bun='0022', ji='0000', platGbCd='0')
          local = threading.local()
          def page(op, n):
              if not hasattr(local, 'session'): local.session = requests.Session()
              params = dict(entry, serviceKey=key, numOfRows=100, pageNo=n, _type='json')
              for attempt in range(8):
                  try:
                      r = local.session.get('https://apis.data.go.kr/1613000/BldRgstHubService/' + op, params=params, timeout=40)
                      r.raise_for_status()
                      d = r.json()['response']
                      if str(d['header']['resultCode']) not in ('00', '000'): raise ValueError('API result failure')
                      body = d['body']
                      items = body.get('items') or {}
                      rows = items.get('item', []) if isinstance(items, dict) else []
                      if isinstance(rows, dict): rows = [rows]
                      return rows, int(body['totalCount'])
                  except (requests.RequestException, KeyError, ValueError):
                      if attempt == 7: raise RuntimeError(f'{op} page {n} failed; request details suppressed') from None
                      time.sleep(min(30, 2 ** attempt))
          def fetch(op):
              first, total = page(op, 1)
              if not first: return []
              size = len(first)
              result = list(first)
              pages = (total + size - 1) // size
              with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
                  for i, (rows, check_total) in enumerate(pool.map(lambda n: page(op, n), range(2, pages + 1)), 2):
                      if check_total != total: raise ValueError('inventory changed during pagination')
                      result.extend(rows)
                      if i % 50 == 0: print(op, 'pages:', i, '/', pages, flush=True)
              if len(result) != total: raise ValueError('incomplete page sequence')
              print(op, 'rows:', len(result), flush=True)
              return result
          titles = [r for r in fetch('getBrTitleInfo') if int(r.get('hhldCnt') or 0) > 0]
          names = sorted({r.get('bldNm', '').strip() for r in titles})
          dongs = sorted({r.get('dongNm', '').strip() for r in titles})
          title_total = sum(int(r['hhldCnt']) for r in titles)
          assert names == ['리센츠'] and len(dongs) == 65
          expos = fetch('getBrExposInfo')
          areas = fetch('getBrExposPubuseAreaInfo')
          allowed_dongs = {unit_key(dict(dongNm=d))[0] for d in dongs}
          housing = [r for r in expos if r.get('bldNm', '').strip() in names and unit_key(r)[0] in allowed_dongs]
          # Audit-only count must NOT substitute for independent title validation.
          candidate_n = len({unit_key(r) for r in housing})
          manifest = dict(entry, complex_key='11710|잠실동|22', building_names=names,
                          housing_dongs=dongs, expected_units=candidate_n)
          candidate = count_units(housing, areas, manifest)
          candidate.update(title_units=title_total, audit_only=True, inventory_date='2026-10-12')
          purpose = Counter((str(r.get('mainPurpsCd') or ''), str(r.get('mainPurpsCdNm') or '')) for r in housing)
          area_counts = Counter()
          for dong, floor, area, n in candidate['pools']: area_counts[area] += n
          candidate['purpose_summary'] = [[*k, n] for k, n in purpose.items()]
          print('TITLE VS UNIT LIST:', title_total, candidate_n)
          print('AREA COUNTS:', dict(sorted(area_counts.items())))
          print('PURPOSE COUNTS:', candidate['purpose_summary'])
          Path('data/units').mkdir(parents=True, exist_ok=True)
          Path('data/units/ricenz-candidate.json').write_text(json.dumps([candidate], ensure_ascii=False), encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ricenz-counted-inventory-and-audits
          path: data/units/*.json
