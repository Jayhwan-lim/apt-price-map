name: Ricenz verified unit pilot

on:
  push:
    branches: [research/ricenz-inventory-pilot-20261011]
  workflow_dispatch:

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATA_GO_KR_HUB_KEY: ${{ secrets.DATA_GO_KR_HUB_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Diagnose HUB status without logging credentials
        run: |
          python - <<'PY'
          import os, requests, xml.etree.ElementTree as ET
          params = dict(serviceKey=os.environ['DATA_GO_KR_HUB_KEY'], sigunguCd='11710',
                        bjdongCd='10100', bun='0022', ji='0000', platGbCd='0',
                        numOfRows=100, pageNo=1, _type='json')
          for op in ('getBrTitleInfo', 'getBrExposInfo', 'getBrExposPubuseAreaInfo'):
              try:
                  r = requests.get('https://apis.data.go.kr/1613000/BldRgstHubService/' + op,
                                   params=params, timeout=40)
                  print(op, 'HTTP:', r.status_code, 'type:', r.headers.get('content-type'), flush=True)
                  try:
                      data = r.json()['response']
                      print(op, 'API code:', data.get('header', {}).get('resultCode'), flush=True)
                  except (ValueError, KeyError):
                      try:
                          root = ET.fromstring(r.text)
                          print(op, 'XML code:', root.findtext('.//returnReasonCode') or root.findtext('.//resultCode'), flush=True)
                      except ET.ParseError:
                          print(op, 'unexpected response format', flush=True)
              except requests.RequestException:
                  print(op, 'transport failed; URL suppressed', flush=True)
          PY
      - name: Validate parcel titles and create private manifest
        run: |
          python - <<'PY'
          import json, os, requests, sys
          from pathlib import Path
          sys.path.insert(0, 'collector')
          from unit_inventory import pages
          entry = {'sigunguCd': '11710', 'bjdongCd': '10100',
                   'bun': '0022', 'ji': '0000', 'platGbCd': '0'}
          rows = list(pages(requests.Session(), os.environ['DATA_GO_KR_HUB_KEY'],
                            entry, 'getBrTitleInfo'))
          housing = [r for r in rows if int(r.get('hhldCnt') or 0) > 0]
          total = sum(int(r['hhldCnt']) for r in housing)
          names = sorted({r.get('bldNm', '').strip() for r in housing})
          dongs = sorted({r.get('dongNm', '').strip() for r in housing})
          print('housing titles:', len(housing), 'total units:', total,
                'distinct dongs:', len(dongs), 'names:', names)
          if total not in (5562, 5563) or not names or not dongs or '' in names or '' in dongs:
              raise SystemExit('parcel/title mismatch; inventory blocked')
          key = '11710|잠실동|22'
          complexes = json.load(open('web/data/complexes.json'))['complexes']
          matches = [c for c in complexes if c['key'] == key]
          if len(matches) != 1:
              raise SystemExit('trade complex key mismatch; inventory blocked')
          entry.update(complex_key=key, building_names=names,
                       housing_dongs=dongs, expected_units=total)
          Path('data/unit_manifest.json').write_text(
              json.dumps([entry], ensure_ascii=False), encoding='utf-8')
          PY
      - name: Join private area and units
        run: python collector/unit_inventory.py --manifest data/unit_manifest.json --output data/units/inventory.json
      - name: Compare sensitivity for two largest area bands
        run: |
          python - <<'PY'
          import json, subprocess, sys
          from collections import Counter
          sys.path.insert(0, 'collector')
          from audit_unit_models import type_of
          entry = json.load(open('data/units/inventory.json'))[0]
          c = next(c for c in json.load(open('web/data/complexes.json'))['complexes']
                   if c['key'] == entry['complex_key'])
          types = json.load(open(f"web/data/region/{c['code']}.json"))['c'][str(c['id'])]['ty']
          counts = Counter()
          for dong, floor, area, units in entry['pools']:
              counts[type_of(types, area)] += units
          print('verified unit bands:', dict(counts), 'total:', sum(counts.values()), flush=True)
          if sum(counts.values()) != entry['expected_units']:
              raise SystemExit('inventory count mismatch')
          for band, units in sorted(counts.items()):
              print('auditing band:', band, 'units:', units, flush=True)
              subprocess.run(['python', 'collector/audit_unit_models.py',
                              '--inventory', 'data/units/inventory.json',
                              '--complex-key', entry['complex_key'], '--band', band,
                              '--output', f'data/units/audit-{band}.json'], check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ricenz-counted-inventory-and-audits
          path: data/units/*.json