name: Verify live touch assets

on:
  push:
    branches: [verify/tablet-touch-live-20261011]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check production HTML and JavaScript release
        run: |
          python - <<'PY'
          import time, urllib.request
          base = 'https://geuttaeneolma.com/'
          for domain in ('https://geuttaeneolma.com/', 'https://jayhwan-lim.github.io/apt-price-map/'):
              for path in ('', 'app.js?v=20261011b', 'sw.js'):
                  url = domain + path
                  try:
                      request = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0', 'Cache-Control': 'no-cache'})
                      response = urllib.request.urlopen(request, timeout=15)
                      data = response.read().decode()
                      expected = ('app.js?v=20261011b' if not path else
                                  'function bindMapSelection' if path.startswith('app.js') else
                                  'geuttaen-20261011b')
                      print(domain, path or 'index', 'HTTP', response.status,
                            'release found:', expected in data, flush=True)
                  except Exception as exc:
                      print(domain, path or 'index', type(exc).__name__,
                            getattr(exc, 'code', ''), flush=True)
          PY
