name: deploy-site

on:
  push:
    branches: [main]
    paths: ["web/**"]
  # Data commits made by collect-trades use GITHUB_TOKEN, which does not
  # trigger push events, so redeploy whenever a collection run finishes.
  workflow_run:
    workflows: [collect-trades]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
