name: Owner comparison research
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python collector/owner_research.py
      - uses: actions/upload-artifact@v4
        with:
          name: owner-research
          path: /tmp/owner-research/*
